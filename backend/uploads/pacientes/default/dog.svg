<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .dog-body { fill: #8B4513; }
      .dog-face { fill: #D2691E; }
      .dog-nose { fill: #000; }
      .dog-eye { fill: #000; }
    </style>
  </defs>
  <!-- Cuerpo -->
  <ellipse cx="50" cy="70" rx="25" ry="20" class="dog-body"/>
  <!-- Cabeza -->
  <circle cx="50" cy="40" r="20" class="dog-face"/>
  <!-- Orejas -->
  <ellipse cx="35" cy="30" rx="8" ry="15" class="dog-body" transform="rotate(-30 35 30)"/>
  <ellipse cx="65" cy="30" rx="8" ry="15" class="dog-body" transform="rotate(30 65 30)"/>
  <!-- Ojos -->
  <circle cx="44" cy="35" r="3" class="dog-eye"/>
  <circle cx="56" cy="35" r="3" class="dog-eye"/>
  <!-- Nariz -->
  <ellipse cx="50" cy="45" rx="2" ry="3" class="dog-nose"/>
  <!-- Cola -->
  <ellipse cx="75" cy="65" rx="5" ry="12" class="dog-body" transform="rotate(45 75 65)"/>
</svg>