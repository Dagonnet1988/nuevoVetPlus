<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .reptile-body { fill: #228B22; }
      .reptile-belly { fill: #90EE90; }
      .reptile-eye { fill: #FFD700; }
      .reptile-pupil { fill: #000; }
      .reptile-scale { fill: #006400; }
    </style>
  </defs>
  <!-- Cuerpo principal -->
  <ellipse cx="50" cy="60" rx="25" ry="20" class="reptile-body"/>
  <!-- Vientre -->
  <ellipse cx="50" cy="65" rx="20" ry="15" class="reptile-belly"/>
  <!-- Cabeza -->
  <ellipse cx="50" cy="35" rx="12" ry="15" class="reptile-body"/>
  <!-- Ojos -->
  <ellipse cx="46" cy="30" rx="3" ry="4" class="reptile-eye"/>
  <ellipse cx="54" cy="30" rx="3" ry="4" class="reptile-eye"/>
  <ellipse cx="46" cy="30" rx="1" ry="3" class="reptile-pupil"/>
  <ellipse cx="54" cy="30" rx="1" ry="3" class="reptile-pupil"/>
  <!-- Patas -->
  <ellipse cx="30" cy="70" rx="5" ry="8" class="reptile-body"/>
  <ellipse cx="70" cy="70" rx="5" ry="8" class="reptile-body"/>
  <ellipse cx="35" cy="55" rx="4" ry="6" class="reptile-body"/>
  <ellipse cx="65" cy="55" rx="4" ry="6" class="reptile-body"/>
  <!-- Cola -->
  <ellipse cx="50" cy="85" rx="8" ry="12" class="reptile-body"/>
  <!-- Escamas decorativas -->
  <circle cx="45" cy="50" r="2" class="reptile-scale"/>
  <circle cx="55" cy="45" r="2" class="reptile-scale"/>
  <circle cx="50" cy="55" r="2" class="reptile-scale"/>
</svg>