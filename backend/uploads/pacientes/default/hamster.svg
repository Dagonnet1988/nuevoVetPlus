<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .hamster-body { fill: #DEB887; }
      .hamster-belly { fill: #F5DEB3; }
      .hamster-ear { fill: #CD853F; }
      .hamster-eye { fill: #000; }
      .hamster-nose { fill: #FF69B4; }
    </style>
  </defs>
  <!-- Cuerpo -->
  <ellipse cx="50" cy="65" rx="25" ry="20" class="hamster-body"/>
  <!-- Vientre -->
  <ellipse cx="50" cy="70" rx="18" ry="15" class="hamster-belly"/>
  <!-- Cabeza -->
  <circle cx="50" cy="40" r="18" class="hamster-body"/>
  <!-- Orejas -->
  <circle cx="40" cy="28" r="6" class="hamster-ear"/>
  <circle cx="60" cy="28" r="6" class="hamster-ear"/>
  <!-- Ojos -->
  <circle cx="45" cy="35" r="2" class="hamster-eye"/>
  <circle cx="55" cy="35" r="2" class="hamster-eye"/>
  <!-- Nariz -->
  <circle cx="50" cy="42" r="1" class="hamster-nose"/>
  <!-- Mejillas -->
  <circle cx="35" cy="42" r="5" class="hamster-body"/>
  <circle cx="65" cy="42" r="5" class="hamster-body"/>
  <!-- Patas -->
  <circle cx="40" cy="80" r="4" class="hamster-body"/>
  <circle cx="60" cy="80" r="4" class="hamster-body"/>
</svg>