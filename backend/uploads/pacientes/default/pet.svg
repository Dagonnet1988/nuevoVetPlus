<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .pet-body { fill: #9932CC; }
      .pet-paw { fill: #8A2BE2; }
      .pet-heart { fill: #FF69B4; }
    </style>
  </defs>
  <!-- Cuerpo principal -->
  <circle cx="50" cy="50" r="25" class="pet-body"/>
  <!-- Huellas de patas -->
  <g class="pet-paw">
    <!-- Pata superior izquierda -->
    <circle cx="35" cy="25" r="3"/>
    <circle cx="32" cy="30" r="2"/>
    <circle cx="38" cy="30" r="2"/>
    <circle cx="35" cy="33" r="2"/>
    
    <!-- Pata superior derecha -->
    <circle cx="65" cy="25" r="3"/>
    <circle cx="62" cy="30" r="2"/>
    <circle cx="68" cy="30" r="2"/>
    <circle cx="65" cy="33" r="2"/>
    
    <!-- Pata inferior izquierda -->
    <circle cx="35" cy="75" r="3"/>
    <circle cx="32" cy="70" r="2"/>
    <circle cx="38" cy="70" r="2"/>
    <circle cx="35" cy="67" r="2"/>
    
    <!-- Pata inferior derecha -->
    <circle cx="65" cy="75" r="3"/>
    <circle cx="62" cy="70" r="2"/>
    <circle cx="68" cy="70" r="2"/>
    <circle cx="65" cy="67" r="2"/>
  </g>
  <!-- Corazón en el centro -->
  <path d="M 50 45 C 45 40, 35 40, 35 50 C 35 55, 50 65, 50 65 C 50 65, 65 55, 65 50 C 65 40, 55 40, 50 45 Z" class="pet-heart"/>
</svg>