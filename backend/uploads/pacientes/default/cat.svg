<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .cat-body { fill: #696969; }
      .cat-face { fill: #808080; }
      .cat-nose { fill: #FF69B4; }
      .cat-eye { fill: #32CD32; }
      .cat-pupil { fill: #000; }
    </style>
  </defs>
  <!-- Cuerpo -->
  <ellipse cx="50" cy="70" rx="22" ry="18" class="cat-body"/>
  <!-- Cabeza -->
  <circle cx="50" cy="40" r="18" class="cat-face"/>
  <!-- Orejas triangulares -->
  <polygon points="35,25 40,35 30,35" class="cat-body"/>
  <polygon points="65,25 70,35 60,35" class="cat-body"/>
  <!-- Ojos -->
  <ellipse cx="44" cy="35" rx="4" ry="6" class="cat-eye"/>
  <ellipse cx="56" cy="35" rx="4" ry="6" class="cat-eye"/>
  <ellipse cx="44" cy="35" rx="1" ry="4" class="cat-pupil"/>
  <ellipse cx="56" cy="35" rx="1" ry="4" class="cat-pupil"/>
  <!-- Nariz -->
  <polygon points="50,42 48,46 52,46" class="cat-nose"/>
  <!-- Cola curva -->
  <path d="M 75 70 Q 85 60 80 45" stroke="#696969" stroke-width="8" fill="none"/>
</svg>