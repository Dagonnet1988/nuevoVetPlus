# =============================
# VETPLUS / RAMELO - NGINX BASE
# =============================
# 1) Esta configuracion esta pensada para:
#    - Frontend: ramelo.app y *.ramelo.app
#    - API: api.ramelo.app
# 2) Aplicar SSL con Certbot y luego agregar los bloques TLS equivalentes.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# -----------------------------
# API - api.ramelo.app
# -----------------------------
server {
    listen 80;
    server_name api.ramelo.app;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# -----------------------------
# Frontend - ramelo.app y tenants
# -----------------------------
server {
    listen 80;
    server_name ramelo.app *.ramelo.app;

    root /var/www/vetplus/frontend;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml;

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location ~* \.(?:js|css|woff2?|png|jpe?g|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}